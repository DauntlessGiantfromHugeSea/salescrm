server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dockers eingebauter DNS. Nötig, weil die API-Adresse unten über eine
    # Variable aufgelöst wird – ohne diese Zeile kennt nginx keinen Resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API weiterreichen.
    #
    # Im Standalone-Betrieb übernimmt der vorgelagerte Caddy das Routing und
    # /api kommt hier gar nicht an. Läuft dagegen ein fremder Reverse Proxy auf
    # dem Server, zeigt der direkt auf diesen Container – dann ist das hier der
    # einzige Weg zur API. Ohne diesen Block scheitert jeder Aufruf still, und
    # das Dashboard zeigt nur die Anmeldeseite.
    location /api/ {
        # Adresse über eine Variable: so löst nginx sie zur Laufzeit auf und
        # startet auch dann, wenn der API-Container noch nicht bereit ist.
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # Der Erstimport und die Entwurfserzeugung dauern länger als die
        # Vorgabe von 60 Sekunden.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Weiterleitungen der Anmeldung dürfen nicht umgeschrieben werden.
        proxy_redirect off;
    }

    # Das Dashboard ist eine Single-Page-Anwendung: jeder Pfad, der keine
    # Datei ist, muss auf index.html zeigen, sonst liefert ein Neuladen
    # von /projekte/xyz einen 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gehashte Assets ändern bei jedem Build ihren Namen und dürfen
    # dauerhaft zwischengespeichert werden.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html selbst nie zwischenspeichern, sonst sieht der Browser
    # nach einem Deploy weiter die alte Anwendung.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
