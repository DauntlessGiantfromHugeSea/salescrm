# Betrieb auf einem eigenen Server unter eigener Domain.
#
#   docker compose up -d
#
# Caddy holt das TLS-Zertifikat selbst von Let's Encrypt – dafür müssen
# Ports 80 und 443 offen sein und der DNS-A-Record auf diesen Server zeigen.

name: salescrm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salescrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-salescrm}
      # Deutsche Sortierung, damit Namenslisten richtig sortieren.
      LANG: de_DE.utf8
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-salescrm} -d ${POSTGRES_DB:-salescrm}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Nicht nach außen exponieren: der Zugriff läuft ausschließlich intern.
    expose:
      - '5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Jobs überleben einen Neustart – ohne Persistenz ginge ein laufender
    # Erstimport bei jedem Deploy verloren.
    command: redis-server --appendonly yes --save 60 1000
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - '6379'

  migrate:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-salescrm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-salescrm}
    # Migrationen laufen einmalig vor API und Worker.
    command: ['npx', 'prisma', 'migrate', 'deploy', '--schema', 'apps/api/prisma/schema.prisma']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-salescrm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-salescrm}
      REDIS_URL: redis://redis:6379
      PORT: '3000'
    command: ['node', 'apps/api/dist/server.js']
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # Nur lokal erreichbar. Im Integrationsbetrieb reicht das dem Reverse Proxy;
    # im Standalone-Betrieb spricht Caddy den Dienst über das interne Netz an.
    ports:
      - '127.0.0.1:${API_PORT:-8091}:3000'

  worker:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-salescrm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-salescrm}
      REDIS_URL: redis://redis:6379
    command: ['node', 'apps/api/dist/worker.js']
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Der Erstimport braucht Zeit zum sauberen Beenden laufender Jobs.
    stop_grace_period: 120s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    # nginx reicht /api an die API weiter, wenn kein eigener Caddy davor liegt.
    depends_on:
      - api
    # Nur auf der Loopback-Adresse: der Reverse Proxy des Servers holt sich das
    # von hier. Damit läuft der Stack auch auf einem Server, auf dem bereits
    # andere Anwendungen die Ports 80 und 443 belegen.
    ports:
      - '127.0.0.1:${WEB_PORT:-8090}:80'
    networks:
      default:
      # Zusätzlich im Netz des vorhandenen Reverse Proxys, damit der den
      # Container direkt über seinen Namen erreicht. Aus einem Proxy-Container
      # heraus ist 127.0.0.1 der Container selbst, nicht der Server – deshalb
      # ist der Weg über ein gemeinsames Netz zuverlässiger als eine IP.
      proxy:
        aliases:
          - ${PROXY_ALIAS:-salescrm-web}

  # Eigener Reverse Proxy – nur für Server, auf denen noch keiner läuft.
  # Start mit: docker compose --profile standalone up -d
  # Läuft dort bereits ein Caddy, Traefik oder nginx, bleibt dieses Profil aus
  # und der vorhandene Proxy bekommt stattdessen einen Eintrag auf ${WEB_PORT}.
  caddy:
    profiles: ['standalone']
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Im Normalfall die Domain, im Demo-Betrieb ":80" (kein Zertifikat).
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN:?DOMAIN oder SITE_ADDRESS muss gesetzt sein}}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

networks:
  default:
  # Netz des bereits vorhandenen Reverse Proxys.
  # PROXY_NETWORK in der .env auf dessen Namen setzen. Ist nichts gesetzt,
  # zeigt der Eintrag auf das eigene Netz und bleibt wirkungslos.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-salescrm_default}

volumes:
  db-data:
  redis-data:
  caddy-data:
  caddy-config:
